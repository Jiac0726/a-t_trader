[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a-t-trader"
version = "0.2.0"
description = "A-share historical T-trading suitability analyzer"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "requests>=2.31",
  "duckdb>=1.1",
  "streamlit>=1.40",
]

[project.optional-dependencies]
akshare = ["akshare>=1.17"]
baostock = ["baostock>=0.9.3"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "app*",
  "backtest*",
  "calibration*",
  "core*",
  "data*",
  "dataset*",
  "features*",
  "presentation*",
  "providers*",
  "scanner*",
  "scoring*",
  "storage*",
  "validation*",
]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
